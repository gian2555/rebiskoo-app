<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="ReceiptSafe: school payment receipts for students and the cashier's office.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ReceiptSafe</title>
  <script>
    /* apply the saved theme before the page paints */
    try { var th = localStorage.getItem('rs-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v18.2a.5.5 0 0 1-.8.4L16 20l-2.2 1.6a.5.5 0 0 1-.6 0L11 20l-2.2 1.6a.5.5 0 0 1-.6 0L6 20l-.2 1.6a.5.5 0 0 1-.8-.4V3a1 1 0 0 1 1-1Zm2 5v2h8V7H8Zm0 4v2h8v-2H8Z"/></svg>
      <div><h1>ReceiptSafe</h1><p class="tag" id="tag"></p></div>
    </div>
    <div class="hdr-right">
      <div id="chip" class="chip" hidden></div>
      <button id="btnLang" class="hbtn" type="button">EN</button>
      <button id="btnTheme" class="hbtn" type="button"></button>
    </div>
  </header>
  <div id="netbar" class="netbar" role="status" hidden></div>

  <main id="view" tabindex="-1"><div class="spin">…</div></main>
  <button id="fab" class="fab" hidden></button>
  <nav id="tabbar" class="tabbar" aria-label="Main" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
